services:
  - type: web
    name: lighto-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lighto-tracker-db
          property: connectionString
      - key: DASHBOARD_PASSWORD
        value: lighto2026   # ← 部署後請在 Render 後台修改這個密碼
      - key: CRYPTO_MICRO_ACTIVE_STRATEGIES
        value: top10scan1_d1_r3_chg3_12_cur1_sl1_tr15x05_t12,top10scan2_d1_r3_chg3_12_cur2_sl1_tr15x05_t12,top10scan3_d1_r3_chg3_12_cur1_sl1_tr1x05_t12,top10scan4_d1_r3_chg3_12_cur2_sl1_tr1x05_t12,top10scan5_d1_r3_chg2_12_cur2_sl1_tr15x05_t12,top10shadow1_d0_r5_chg2_15_cur0_sl1_tr1x05_t12,top10shadow2_d0_r10_chg1_20_cur0_sl12_tr15x06_t12,top10shadow3_d1_r5_chg1_12_cur0_vol08_sl1_tr1x05_t18

databases:
  - name: lighto-tracker-db
    databaseName: lighto_tracker
    plan: free
