services:
  - type: web
    name: lighto-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lighto-tracker-db
          property: connectionString
      - key: DASHBOARD_PASSWORD
        value: lighto2026   # ← 部署後請在 Render 後台修改這個密碼
      - key: CRYPTO_MICRO_ACTIVE_STRATEGIES
        value: top5dplus_score95_chg2_5_sl1_tr06x03_t6,sweep_best_d2_r3_chg2-8_green_sl2_tr0.8x0.4_t18,auto_top1_4h_d3_r3_chg2-8_green_uw12_vol15_sl0.8_be0.6_tr0.9x0.4_t8,auto_top2_4h_d3_r3_chg2-8_green_uw12_vol15_sl0.8_be0.6_tr0.9x0.4_t12,auto_top3_4h_d3_r3_chg2-8_green_uw12_vol15_sl0.8_be0.6_tr0.9x0.4_t18,strategy20_6h12h_cool_vwap_reclaim,strategy4_breakout_confirmation

databases:
  - name: lighto-tracker-db
    databaseName: lighto_tracker
    plan: free
