services:
  - type: web
    name: lighto-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lighto-tracker-db
          property: connectionString
      - key: DASHBOARD_PASSWORD
        value: lighto2026   # ← 部署後請在 Render 後台修改這個密碼
      - key: CRYPTO_MICRO_ACTIVE_STRATEGIES
        value: auto_top1_4h_d2_r3_chg3-10_green_reclaim_uw08_sl1.0_be0.6_tr0.9x0.4_t8,auto_top2_4h_d2_r3_chg3-10_green_reclaim_uw08_sl1.5_be0.6_tr0.9x0.4_t8,auto_top3_4h_d2_r3_chg3-10_green_reclaim_uw08_sl2.0_be0.6_tr0.9x0.4_t8,strategy4_1_breakout_confirmation,strategy20_6h12h_cool_vwap_reclaim,top5dplus_score95_chg2_5_sl1_tr06x03_t6

databases:
  - name: lighto-tracker-db
    databaseName: lighto_tracker
    plan: free
