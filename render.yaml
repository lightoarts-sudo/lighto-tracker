services:
  - type: web
    name: lighto-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lighto-tracker-db
          property: connectionString
      - key: DASHBOARD_PASSWORD
        value: lighto2026   # ← 部署後請在 Render 後台修改這個密碼
      - key: CRYPTO_MICRO_ACTIVE_STRATEGIES
        value: auto_top1_combined_d3_r3_chg2-8_green_uw08_reclaim_vol15_spread25_pct2h3h_sl0.8_be0.6_tr0.9x0.4_t8,strategy4_breakout_confirmation,strategy20_6h12h_cool_vwap_reclaim,top10scan_d2_r5_chg2-8_cur2_vol1.2_sl0.8_tr1.5x0.5_t12,top5dplus_score95_chg2_5_sl1_tr06x03_t6

databases:
  - name: lighto-tracker-db
    databaseName: lighto_tracker
    plan: free