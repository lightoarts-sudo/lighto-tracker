    <script type="module">
      try {
        const response = await fetch("api/tracker", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (!Array.isArray(payload.items) || payload.items.length < 1) {
          throw new Error("Tracker API payload is incomplete");
        }
        window.__POPOSTOCK_TRACKER_DATA__ = payload;
      } catch (error) {
        console.warn("Tracker API unavailable; using static fallback", error);
      }
      await import("/popostock/assets/index-bc55eed8.js");
    </script>

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const key = "popostock-page-view-counted";
        try {
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, "pending");
        } catch {
          return;
        }

        fetch("api/page-view", { method: "POST", keepalive: true })
          .then((response) => {
            if (!response.ok) throw new Error("Page view was not recorded");
            sessionStorage.setItem(key, "yes");
          })
          .catch(() => sessionStorage.removeItem(key));
      })();
    </script>
  </body>
