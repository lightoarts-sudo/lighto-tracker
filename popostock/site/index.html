    <script type="module">
      try {
        const response = await fetch("api/tracker", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (!Array.isArray(payload.items) || payload.items.length < 1) {
          throw new Error("Tracker API payload is incomplete");
        }
        window.__POPOSTOCK_TRACKER_DATA__ = payload;
      } catch (error) {
        console.warn("Tracker API unavailable; using static fallback", error);
      }

    <style id="popostock-layout-override">
/* 美股大盤區塊：標題放圖表上方（與手機版一致） */
.taiex-header{flex-direction:column !important;align-items:stretch !important;gap:14px !important}

/* 加減碼卡片：原本股名 13px、代號 11px、金額 10px，手機上太小。
   放大字級並拉開行距，維持原本的左右兩欄結構。 */
.active-etf-movement-columns h3{font-size:15px !important;margin-bottom:12px !important}
.active-etf-movement-columns li{padding:12px 0 !important;gap:14px !important}
.active-etf-movement-columns li>span{gap:3px !important}
.active-etf-movement-columns li strong{font-size:16px !important;line-height:1.35 !important}
.active-etf-movement-columns li small{font-size:13px !important}
.active-etf-movement-columns .active-etf-movement-value{text-align:right}
.active-etf-movement-columns .active-etf-movement-value b{font-size:17px !important}
.active-etf-movement-columns .active-etf-movement-value small{font-size:13px !important}
.active-etf-movement-columns section>p{font-size:14px !important;padding:12px 0 !important}
.active-etf-change-card>header strong{font-size:19px !important}
.active-etf-change-card>header span{font-size:15px !important}

/* 加減碼卡片標題連到該 ETF 的完整頁面；沿用原本的直排間距，
   不加底線以免與卡片標題樣式衝突，hover 才提示可點。 */
.active-etf-card-link{display:flex;flex-direction:column;gap:4px;width:100%;
  color:inherit;text-decoration:none}
.active-etf-card-link:hover strong{text-decoration:underline;
  text-decoration-thickness:2px;text-underline-offset:3px}
.active-etf-card-link:focus-visible{outline:3px solid rgba(255,255,255,.5);
  outline-offset:3px;border-radius:4px}

/* 共識加碼統計：手機版原本一欄四列，整組要捲很久才看得完。
   改成 2x2 讓四個數字並列，站台斷點為 720px。 */
@media (width<=720px){
  .consensus-summary{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .consensus-summary>div{padding:13px 14px !important;gap:4px !important;

  .consensus-summary>div:nth-child(2n){border-right:0 !important}
  .consensus-summary>div:nth-last-child(-n+2){border-bottom:0 !important}
  .consensus-summary strong{font-size:21px !important;line-height:1.2 !important}
  .consensus-summary span{font-size:12.5px !important}
}

<style id="popostock-performance-matrix">
/* 八個期間並列，欄位變多，所以縮排距、數字靠右並用等寬數字避免跳動。 */
.performance-table{min-width:1220px}
.performance-table th,.performance-table td{padding:9px 11px}
.performance-table th.performance-period-col{padding:0;text-align:right}
.performance-table .performance-period-sort{display:flex;justify-content:flex-end;
  align-items:center;gap:5px;width:100%;padding:9px 11px;border:0;background:0 0;
  color:inherit;font:inherit;font-weight:850;text-align:right;white-space:nowrap;
  cursor:pointer}
.performance-table .performance-period-sort:hover{color:var(--gold,#ffd43b);
  text-decoration:underline;text-underline-offset:3px}
/* 未選中的欄位給一個淡的 ↕ 提示可以點，選中的才是實心方向箭頭。 */
.performance-sort-arrow{font-size:12px;line-height:1;opacity:.45}
.performance-table th.performance-period-col:hover .performance-sort-arrow{opacity:.8}
/* 被選中的期間＝目前的排序依據，整欄（含標題）標示出來。表頭是深藍底白字，
   所以標題用淡白底＋金色字，不能沿用內文那個淺藍底（白字會看不見）。 */
.performance-table th.performance-period-col.is-active{
  background:rgba(255,255,255,.16);color:var(--gold,#ffd43b)}
.performance-table th.performance-period-col.is-active .performance-period-sort{
  color:var(--gold,#ffd43b);text-decoration:underline;text-underline-offset:3px}
.performance-table th.performance-period-col.is-active .performance-sort-arrow{
  opacity:1;font-size:13px}
.performance-table td.performance-period-col{text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-weight:900}
.performance-table td.performance-period-col.is-active{background:#eef4fb}
.performance-table .performance-return.is-blank{color:var(--muted);font-weight:750}
/* 期間按鈕列移除後，控制列只剩分類切換與日期控制一行。 */
.performance-controls{display:block}
/* 分類改多選：全選時四顆會同時亮，整條變成一塊深藍就看不出差別。
   個別分類用淺藍底深藍字並加一個勾，「全部」維持深藍實心。 */
.performance-panel .scope-switch button.is-active{
  background:#dce7f6 !important;color:#12295c !important}
.performance-panel .scope-switch button.is-active:not(:first-child):before{
  content:"✓ ";font-weight:900}
.performance-panel .scope-switch button:first-child.is-active{
  background:var(--navy) !important;color:var(--gold) !important}

@media (width<=720px){
  /* 站台的手機表格會把每一格攤成「標籤＋值」的卡片，11 欄會變成十幾行高的區塊。
     這裡改回真正的表格＋橫向捲動，並把排名與標的釘在左側，捲到右邊仍看得出是誰。
     sticky 需要 separate，collapse 下邊框不會跟著移動。 */
  .performance-table-scroll{overflow-x:auto !important;overflow-y:visible !important;
    -webkit-overflow-scrolling:touch}
  .performance-table{min-width:880px !important;border-collapse:separate !important;
    border-spacing:0 !important;font-size:13px}
  .performance-table thead{display:table-header-group !important}
  .performance-table tbody{display:table-row-group !important;gap:0 !important}
  .performance-table tbody tr{display:table-row !important;border:0 !important;
    border-radius:0 !important;overflow:visible !important}
  .performance-table th,.performance-table td{display:table-cell !important;
    border-right:0 !important;border-bottom:1px solid var(--line) !important;
    padding:8px 9px !important;white-space:nowrap !important;
    align-content:unset !important}
  /* separate 之後每一格要自己補底色，不然釘住的欄位會透出下方的內容。
     表頭沿用深藍（白字），內容用白底。 */
  .performance-table td{background:#fff}
  .performance-table th{background:var(--navy,#06275f)}
  .performance-table td:before{display:none !important}
  .performance-table th.performance-period-col{padding:0 !important}
  .performance-table .performance-period-sort{padding:8px 9px;font-size:12.5px}
  .performance-table th:nth-child(1),.performance-table td:nth-child(1),
  .performance-table th:nth-child(2),.performance-table td:nth-child(2){
    position:sticky;z-index:2}
  .performance-table th:nth-child(1),.performance-table td:nth-child(1){
    left:0;width:38px !important;min-width:38px}
  /* 名稱欄要夾住寬度並允許斷行，否則長基金名在 nowrap 下會把釘住的欄位
     撐到半個螢幕，右邊的期間欄位就沒空間了。 */
  .performance-table th:nth-child(2),.performance-table td:nth-child(2){
    left:38px;width:134px;min-width:134px;max-width:134px;
    white-space:normal !important;box-shadow:1px 0 0 var(--line)}
  .performance-table td:nth-child(2) .performance-instrument strong,
  .performance-table td:nth-child(2) .performance-instrument small{
    white-space:normal;overflow-wrap:anywhere;line-height:1.3}
  /* 表頭是深藍底白字，釘住的兩欄標題要保留深藍，否則白字落在淺底上看不見。 */
  .performance-table th:nth-child(1),.performance-table th:nth-child(2){
    background:var(--navy,#06275f) !important}
  .performance-table td:nth-child(1),.performance-table td:nth-child(2){
    background:#f6f9fd !important}
  .performance-table td.performance-period-col.is-active{background:#eef4fb !important}
  .performance-table th.performance-period-col.is-active{
    background:rgba(255,255,255,.16) !important}
}
</style>

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const key = "popostock-page-view-counted";
        try {
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, "pending");
        } catch {
          return;
        }

        fetch("api/page-view", { method: "POST", keepalive: true })
          .then((response) => {
            if (!response.ok) throw new Error("Page view was not recorded");
            sessionStorage.setItem(key, "yes");
          })
          .catch(() => sessionStorage.removeItem(key));
      })();
    </script>
