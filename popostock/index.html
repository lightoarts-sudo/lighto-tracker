<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popostock 市場資料庫</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #687684;
      --line: #d9e0e5;
      --paper: #ffffff;
      --canvas: #f1f4f5;
      --accent: #087f75;
      --up: #d9473f;
      --down: #16865a;
      --amber: #c37a08;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); }
    body { font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; letter-spacing: 0; }
    button, input { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 286px minmax(0, 1fr); }
    aside { background: #142129; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    .brand { padding: 24px 20px 18px; border-bottom: 1px solid #2a3941; }
    .brand strong { display: block; font-size: 22px; }
    .brand span { display: block; color: #9fb0b8; font-size: 12px; margin-top: 5px; }
    .search { padding: 14px; border-bottom: 1px solid #2a3941; }
    .search input { width: 100%; border: 1px solid #41515a; color: #fff; background: #1d2d35; padding: 10px 12px; border-radius: 6px; outline: none; }
    .search input:focus { border-color: #52b5a8; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 14px; }
    .tabs button { border: 0; background: transparent; color: #aebcc3; padding: 7px 2px; cursor: pointer; border-bottom: 2px solid transparent; }
    .tabs button.active { color: #fff; border-color: #49b9ab; }
    .symbols { overflow: auto; flex: 1; }
    .symbol { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; text-align: left; border: 0; border-bottom: 1px solid #293a43; background: transparent; color: #fff; padding: 13px 16px; cursor: pointer; }
    .symbol:hover, .symbol.active { background: #20333c; }
    .symbol.active { box-shadow: inset 3px 0 #50bcad; }
    .symbol-code { font-weight: 700; }
    .symbol-change { font-size: 13px; font-weight: 700; }
    .symbol-name { color: #aebcc3; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    main { min-width: 0; padding: 22px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 25px; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 14px; }
    .source { color: var(--accent); text-decoration: none; }
    .source:hover { text-decoration: underline; }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { min-width: 126px; border-left: 3px solid var(--accent); background: var(--paper); padding: 10px 12px; box-shadow: 0 1px 2px rgba(15, 25, 35, .08); }
    .stat b { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 11px; }
    .toolbar { min-height: 52px; background: var(--paper); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 12px; }
    .instrument-title { min-width: 0; }
    .instrument-title strong { font-size: 18px; margin-right: 8px; }
    .instrument-title span { color: var(--muted); font-size: 13px; }
    .periods { display: flex; gap: 3px; }
    .periods button { border: 1px solid transparent; background: transparent; color: var(--muted); padding: 7px 10px; cursor: pointer; border-radius: 4px; }
    .periods button.active { color: var(--accent); border-color: #9bcfc8; background: #edf8f6; }
    .chart-shell { position: relative; background: var(--paper); border: 1px solid var(--line); border-top: 0; height: min(68vh, 680px); min-height: 430px; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .tooltip { position: absolute; pointer-events: none; display: none; background: rgba(20, 33, 41, .94); color: #fff; padding: 8px 10px; border-radius: 4px; font-size: 12px; line-height: 1.55; white-space: nowrap; z-index: 2; }
    .legend { position: absolute; top: 10px; left: 14px; display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--muted); pointer-events: none; }
    .legend i { display: inline-block; width: 15px; height: 2px; margin-right: 4px; vertical-align: middle; }
    .empty { padding: 70px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      aside { min-height: 0; max-height: 310px; }
      .symbols { max-height: 170px; }
      main { padding: 14px; }
      .topbar { display: block; }
      .summary { margin-top: 14px; }
      .stat { min-width: calc(50% - 5px); }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .chart-shell { height: 58vh; min-height: 390px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><strong>Popostock</strong><span>市場歷史資料庫</span></div>
      <div class="search"><input id="search" type="search" placeholder="搜尋代號或名稱" autocomplete="off"></div>
      <div class="tabs" id="tabs">
        <button class="active" data-category="all">全部</button>
        <button data-category="index">指數</button>
        <button data-category="active_etf">主動</button>
        <button data-category="passive_etf">被動</button>
        <button data-category="fund">基金</button>
      </div>
      <div class="symbols" id="symbols"></div>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h1>市場 K 線</h1>
          <div class="subtitle" id="coverage">正在讀取資料庫</div>
        </div>
        <div class="summary">
          <div class="stat"><b id="instrumentCount">-</b><span>追蹤標的</span></div>
          <div class="stat"><b id="candleCount">-</b><span>歷史資料筆數</span></div>
          <div class="stat"><b id="latestDate">-</b><span>最新資料日</span></div>
        </div>
      </header>
      <section class="toolbar">
        <div class="instrument-title"><strong id="selectedCode">-</strong><span id="selectedName"></span></div>
        <div class="periods" id="periods">
          <button data-days="60">3月</button>
          <button class="active" data-days="180">1年</button>
          <button data-days="600">3年</button>
          <button data-days="1600">10年</button>
          <button data-days="0">全部</button>
        </div>
      </section>
      <section class="chart-shell">
        <canvas id="chart"></canvas>
        <div class="legend">
          <span><i style="background:#2874c6"></i>MA20</span>
          <span><i style="background:#c37a08"></i>MA60</span>
          <span><i style="background:#8155a6"></i>MA120</span>
          <span><i style="background:#555f68"></i>MA240</span>
        </div>
        <div class="tooltip" id="tooltip"></div>
      </section>
    </main>
  </div>
  <script>
    const state = { instruments: [], category: 'all', query: '', selected: null, candles: [], visible: 180, offset: 0, dragX: null };
    const $ = (id) => document.getElementById(id);
    const fmt = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 2 });
    const categoryNames = { index: '指數', active_etf: '主動 ETF', passive_etf: '被動 ETF', fund: '基金' };

    async function load() {
      const [summary, instruments] = await Promise.all([
        fetch('/popostock/api/summary').then(r => r.json()),
        fetch('/popostock/api/instruments').then(r => r.json())
      ]);
      state.instruments = instruments;
      $('instrumentCount').textContent = fmt.format(summary.instruments);
      $('candleCount').textContent = fmt.format(summary.candles);
      $('latestDate').textContent = summary.latestDate || '-';
      $('coverage').textContent = `${summary.firstDate || '-'} 至 ${summary.latestDate || '-'}`;
      renderSymbols();
      const first = instruments.find(x => x.symbol === 'TAIEX') || instruments[0];
      if (first) selectInstrument(first.symbol);
    }

    function renderSymbols() {
      const query = state.query.trim().toLowerCase();
      const rows = state.instruments.filter(item =>
        (state.category === 'all' || item.category === state.category) &&
        (!query || item.symbol.toLowerCase().includes(query) || item.name.toLowerCase().includes(query))
      );
      $('symbols').innerHTML = rows.map(item => {
        const change = item.changePct;
        const cls = change > 0 ? 'up' : change < 0 ? 'down' : '';
        const label = change == null ? '-' : `${change > 0 ? '+' : ''}${change.toFixed(2)}%`;
        return `<button class="symbol ${state.selected?.symbol === item.symbol ? 'active' : ''}" data-symbol="${item.symbol}">
          <span class="symbol-code">${item.symbol}</span><span class="symbol-change ${cls}">${label}</span>
          <span class="symbol-name">${item.name}</span><span></span>
        </button>`;
      }).join('') || '<div class="empty">沒有符合的標的</div>';
      document.querySelectorAll('.symbol[data-symbol]').forEach(button => {
        button.addEventListener('click', () => selectInstrument(button.dataset.symbol));
      });
    }

    async function selectInstrument(symbol) {
      const selected = state.instruments.find(item => item.symbol === symbol);
      if (!selected) return;
      state.selected = selected;
      renderSymbols();
      $('selectedCode').textContent = selected.symbol;
      $('selectedName').innerHTML = `${selected.name} · ${categoryNames[selected.category] || selected.category}` +
        (selected.sourceUrl ? ` · <a class="source" href="${selected.sourceUrl}" target="_blank" rel="noreferrer">資料來源</a>` : '');
      state.candles = await fetch(`/popostock/api/candles/${encodeURIComponent(symbol)}`).then(r => r.json());
      state.offset = 0;
      draw();
    }

    function movingAverage(rows, period) {
      const result = new Array(rows.length).fill(null);
      let sum = 0;
      for (let i = 0; i < rows.length; i++) {
        sum += rows[i].close;
        if (i >= period) sum -= rows[i - period].close;
        if (i >= period - 1) result[i] = sum / period;
      }
      return result;
    }

    function getWindow() {
      const total = state.candles.length;
      const count = state.visible === 0 ? total : Math.min(state.visible, total);
      const end = Math.max(count, total - state.offset);
      const start = Math.max(0, end - count);
      return { rows: state.candles.slice(start, end), start, end };
    }

    function draw() {
      const canvas = $('chart');
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const width = rect.width, height = rect.height;
      ctx.clearRect(0, 0, width, height);
      if (!state.candles.length) return;

      const { rows, start } = getWindow();
      const margin = { top: 38, right: 66, bottom: 30, left: 12 };
      const volumeHeight = 92;
      const plotBottom = height - margin.bottom - volumeHeight;
      const plotHeight = plotBottom - margin.top;
      const values = rows.flatMap(r => [r.low ?? r.close, r.high ?? r.close]).filter(Number.isFinite);
      let min = Math.min(...values), max = Math.max(...values);
      const pad = (max - min || max * .05 || 1) * .08;
      min -= pad; max += pad;
      const x = i => margin.left + (i + .5) * (width - margin.left - margin.right) / rows.length;
      const y = v => margin.top + (max - v) / (max - min) * plotHeight;
      const step = (width - margin.left - margin.right) / rows.length;

      ctx.strokeStyle = '#e5eaed'; ctx.lineWidth = 1; ctx.fillStyle = '#788691'; ctx.font = '11px Arial';
      for (let i = 0; i <= 5; i++) {
        const yy = margin.top + plotHeight * i / 5;
        ctx.beginPath(); ctx.moveTo(margin.left, yy); ctx.lineTo(width - margin.right, yy); ctx.stroke();
        const value = max - (max - min) * i / 5;
        ctx.fillText(fmt.format(value), width - margin.right + 7, yy + 4);
      }

      const maxVolume = Math.max(1, ...rows.map(r => r.volume || 0));
      const candleWidth = Math.max(1, Math.min(10, step * .65));
      rows.forEach((row, i) => {
        const up = row.close >= (row.open ?? row.close);
        const color = up ? '#d9473f' : '#16865a';
        const xx = x(i);
        if (row.open != null && row.high != null && row.low != null) {
          ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(xx, y(row.high)); ctx.lineTo(xx, y(row.low)); ctx.stroke();
          const top = y(Math.max(row.open, row.close));
          const bodyHeight = Math.max(1, Math.abs(y(row.open) - y(row.close)));
          ctx.fillRect(xx - candleWidth / 2, top, candleWidth, bodyHeight);
        }
        if (row.volume) {
          const vh = row.volume / maxVolume * (volumeHeight - 24);
          ctx.globalAlpha = .45; ctx.fillStyle = color;
          ctx.fillRect(xx - candleWidth / 2, height - margin.bottom - vh, candleWidth, vh);
          ctx.globalAlpha = 1;
        }
      });

      const colors = ['#2874c6', '#c37a08', '#8155a6', '#555f68'];
      [20, 60, 120, 240].forEach((period, pIndex) => {
        const ma = movingAverage(state.candles, period).slice(start, start + rows.length);
        ctx.strokeStyle = colors[pIndex]; ctx.lineWidth = 1.4; ctx.beginPath();
        let started = false;
        ma.forEach((value, i) => {
          if (value == null) return;
          if (!started) { ctx.moveTo(x(i), y(value)); started = true; } else ctx.lineTo(x(i), y(value));
        });
        if (started) ctx.stroke();
      });

      if (state.selected?.category === 'fund') {
        ctx.strokeStyle = '#087f75'; ctx.lineWidth = 2; ctx.beginPath();
        rows.forEach((row, i) => i ? ctx.lineTo(x(i), y(row.close)) : ctx.moveTo(x(i), y(row.close)));
        ctx.stroke();
      }

      ctx.fillStyle = '#788691'; ctx.font = '11px Arial';
      const labelEvery = Math.max(1, Math.ceil(rows.length / 7));
      rows.forEach((row, i) => {
        if (i % labelEvery) return;
        ctx.fillText(row.time, Math.max(2, x(i) - 32), height - 9);
      });
      canvas._chart = { rows, x, step, margin, width, height };
    }

    function tooltipAt(event) {
      const chart = $('chart')._chart;
      if (!chart) return;
      const rect = $('chart').getBoundingClientRect();
      const px = event.clientX - rect.left;
      const index = Math.max(0, Math.min(chart.rows.length - 1, Math.floor((px - chart.margin.left) / chart.step)));
      const row = chart.rows[index];
      if (!row) return;
      const change = row.open ? (row.close / row.open - 1) * 100 : null;
      $('tooltip').innerHTML = `<b>${row.time}</b><br>` +
        (row.open == null ? `淨值 ${fmt.format(row.close)}` :
        `開 ${fmt.format(row.open)}　高 ${fmt.format(row.high)}<br>低 ${fmt.format(row.low)}　收 ${fmt.format(row.close)}<br>` +
        `<span class="${change >= 0 ? 'up' : 'down'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>　量 ${fmt.format(row.volume || 0)}`);
      $('tooltip').style.display = 'block';
      $('tooltip').style.left = `${Math.min(rect.width - 210, Math.max(8, px + 14))}px`;
      $('tooltip').style.top = `${Math.max(46, event.clientY - rect.top - 50)}px`;
    }

    $('search').addEventListener('input', event => { state.query = event.target.value; renderSymbols(); });
    $('tabs').addEventListener('click', event => {
      const button = event.target.closest('button[data-category]'); if (!button) return;
      state.category = button.dataset.category;
      document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === button));
      renderSymbols();
    });
    $('periods').addEventListener('click', event => {
      const button = event.target.closest('button[data-days]'); if (!button) return;
      state.visible = Number(button.dataset.days); state.offset = 0;
      document.querySelectorAll('#periods button').forEach(x => x.classList.toggle('active', x === button)); draw();
    });
    $('chart').addEventListener('wheel', event => {
      event.preventDefault();
      const current = state.visible || state.candles.length;
      state.visible = Math.max(30, Math.min(state.candles.length, Math.round(current * (event.deltaY > 0 ? 1.18 : .84))));
      draw();
    }, { passive: false });
    $('chart').addEventListener('pointerdown', event => { state.dragX = event.clientX; $('chart').setPointerCapture(event.pointerId); });
    $('chart').addEventListener('pointermove', event => {
      tooltipAt(event);
      if (state.dragX == null) return;
      const chart = $('chart')._chart; if (!chart) return;
      const delta = Math.round((state.dragX - event.clientX) / Math.max(1, chart.step));
      if (delta) {
        const count = state.visible || state.candles.length;
        state.offset = Math.max(0, Math.min(state.candles.length - count, state.offset + delta));
        state.dragX = event.clientX; draw();
      }
    });
    $('chart').addEventListener('pointerup', () => { state.dragX = null; });
    $('chart').addEventListener('pointerleave', () => { state.dragX = null; $('tooltip').style.display = 'none'; });
    window.addEventListener('resize', draw);
    load().catch(error => { $('coverage').textContent = `資料讀取失敗：${error.message}`; });
  </script>
</body>
</html>
